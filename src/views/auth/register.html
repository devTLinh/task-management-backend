<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — TaskManager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/auth.css" />
  <link rel="stylesheet" href="./assets/css/app.css" />
  <script defer src="./assets/js/toast.js"></script></head>
<body>
  <section class="auth">
    <div class="auth__container">
      <div class="auth__box">
        <div class="auth__logo">
          <i class="fa-solid fa-layer-group"></i> TaskManager
        </div>
        <h2 class="auth__title">Create Your Account</h2>
        <p class="auth__desc">Join TaskManager to plan, collaborate, and achieve more together.</p>

        <form class="auth__form">
          <div class="auth__field">
            <label><i class="fa-solid fa-user"></i> Full Name</label>
            <input type="text" placeholder="John Doe" required />
          </div>

          <div class="auth__field">
            <label><i class="fa-solid fa-envelope"></i> Email</label>
            <input type="email" placeholder="you@example.com" required />
          </div>

          <div class="auth__field">
            <label><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" placeholder="********" required />
          </div>

          <button class="btn btn--primary" type="submit">Sign Up</button>
        </form>

        <p class="auth__switch">
          Already have an account?
          <a href="login.html">Log in here</a>
        </p>

        <a href="home.html" class="auth__back">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </section>
  <script>
    // Mock auth + save password hash
    (function(){
      const toHex = (buf)=> Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      const sha256 = async (txt)=> { try { const d=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return toHex(d); } catch { return btoa(unescape(encodeURIComponent(txt))); } };
      const form = document.querySelector('.auth__form');
      if(form){
        form.addEventListener('submit', async function(e){
          e.preventDefault();
          const pwdInput = form.querySelector('input[type="password"]');
          const pwd = pwdInput?.value || '';
          if (pwd.length < 6) { window.showToast && showToast('Password must be at least 6 characters','warning'); return; }
          const hash = await sha256(pwd);
          localStorage.setItem('tm.pass', hash);
          localStorage.setItem('tm.auth','1');
          const nameInput = form.querySelector('input[type="text"]');
          const emailInput = form.querySelector('input[type="email"]');
          if (nameInput && nameInput.value) localStorage.setItem('tm.userName', nameInput.value.trim());
          if (emailInput && emailInput.value) localStorage.setItem('tm.email', emailInput.value.trim());
          if (!localStorage.getItem('tm.role')) localStorage.setItem('tm.role','Member');
          window.location.href = 'home.html';
        });
      }
    })();
  </script>
</body>
</html>
